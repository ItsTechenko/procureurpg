<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bureau du Procureur général — State of San Andreas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Tinos:ital,wght@0,400;0,700;1,400&family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--navy:#14233C;--grid:#2b2b2b;--band:#e3e3e3;--grey:#5a5a5a;--fill:#eaf1fb;--bg:#1d2430;--side:#121821;--accent:#c9a54a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Arimo,Helvetica,Arial,sans-serif;background:var(--bg);color:#e8ebf0;display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
#side{width:300px;flex:0 0 300px;background:var(--side);border-right:1px solid #2a3342;display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.brand{display:flex;gap:10px;align-items:center;padding:16px 16px 12px;border-bottom:1px solid #2a3342}
.brand b{display:block;font-family:Tinos,serif;font-size:15px;letter-spacing:.3px}
.brand small{color:#9aa6b8;font-size:11px}
.case{padding:12px 16px;border-bottom:1px solid #2a3342}
.case h3,.list h3{margin:0 0 8px;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent)}
.case label{display:block;font-size:10px;color:#9aa6b8;margin:7px 0 3px;text-transform:uppercase;letter-spacing:.5px}
.case input{width:100%;background:#0c1118;border:1px solid #2f3a4b;border-radius:6px;color:#fff;padding:7px 9px;font:13px Arimo,sans-serif}
.case input:focus{outline:none;border-color:var(--accent)}
.case .btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.list{flex:1;overflow:auto;padding:12px 10px 16px}
.list h3{padding:0 6px}
.item{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;color:#cfd6e0;padding:7px 8px;border-radius:6px;cursor:pointer;font:13px Arimo,sans-serif}
.item:hover{background:#1e2735}
.item.on{background:#2a3546;color:#fff}
.item code{font:700 11px Arimo,sans-serif;color:var(--accent);min-width:50px}
.item .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#3fb27f;opacity:0}
.item.filled .dot{opacity:1}
.grp{font-size:10px;color:#6f7b8f;text-transform:uppercase;letter-spacing:1px;padding:10px 8px 4px}
.btn{background:#2a3546;color:#fff;border:1px solid #39465a;border-radius:6px;padding:7px 11px;font:600 12px Arimo,sans-serif;cursor:pointer}
.btn:hover{background:#344158}
.btn.gold{background:var(--accent);border-color:var(--accent);color:#141414}
.btn.gold:hover{filter:brightness(1.08)}
.btn.small{padding:5px 8px;font-size:11px}
/* ---------- main ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;padding:0 20px 60px}
.toolbar{position:sticky;top:0;z-index:5;width:100%;max-width:880px;display:flex;gap:8px;align-items:center;padding:12px 0;background:var(--bg)}
.toolbar .t{font-family:Tinos,serif;font-size:17px;margin-right:auto}
.toolbar .t small{display:block;font:11px Arimo,sans-serif;color:#9aa6b8}
.hint{max-width:880px;width:100%;font-size:12px;color:#9aa6b8;margin:-2px 0 10px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0c1118;border:1px solid var(--accent);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
/* ---------- paper ---------- */
.paper{width:816px;max-width:100%;background:#fff;color:#111;padding:34px 44px 26px;box-shadow:0 10px 40px rgba(0,0,0,.45);font-family:Tinos,'Times New Roman',serif;font-size:13px;position:relative}
.hdr{display:grid;grid-template-columns:70px 1fr 86px;align-items:center;gap:10px;padding-bottom:9px;border-bottom:2px solid #111;box-shadow:0 3px 0 -2px #fff,0 4px 0 -2px #111;margin-bottom:12px}
.hdr .mid{text-align:center;line-height:1.25}
.hdr .l1{font-weight:700;font-size:14px}
.hdr .l2{font-weight:700;font-size:17px}
.hdr .l3{font-style:italic;font-size:11.5px}
.hdr .lc{font-size:12.5px}
.codebox{border:1.6px solid #2b2b2b;text-align:center;padding:7px 2px 5px}
.codebox b{font:700 18px Arimo,sans-serif;display:block}
.codebox span{font:9px Arimo,sans-serif;color:#555}
.banner{background:#7a0f0f;color:#fff;font:700 9.5px Arimo,sans-serif;text-align:center;padding:4px;margin-bottom:8px;letter-spacing:.2px}
.ttl{text-align:center;margin-bottom:10px}
.ttl h1{font-size:22px;margin:4px 0 2px;letter-spacing:.3px}
.ttl .en{font-style:italic;font-size:13.5px}
.ttl .ref{font:9px Arimo,sans-serif;color:#555;margin-top:3px}
.cell{border:.8px solid var(--grid);margin:-.4px;padding:2px 4px 3px;position:relative;min-width:0}
.lbl{font:8.2px Arimo,sans-serif;color:#555;text-transform:uppercase;letter-spacing:.2px;display:block;line-height:1.3}
.row{display:flex}
.row .cell{flex-basis:0}
.sec{background:var(--band);border:.8px solid var(--grid);margin:6px -.4px -.4px;padding:3px 6px;font:700 10.5px Arimo,sans-serif;text-transform:uppercase;letter-spacing:.2px}
.paper input[type=text],.paper textarea{width:100%;border:0;background:var(--fill);font:13px Arimo,sans-serif;color:#0b1a33;padding:2px 4px;border-radius:2px;min-width:0}
.paper input[type=text]:focus,.paper textarea:focus{outline:1.5px solid #6d93d1;background:#dfeafa}
.paper textarea{resize:vertical;line-height:1.38;display:block;overflow:hidden}
.static{font-weight:700;font-size:13px;padding:2px 2px 0;display:block}
.chk{display:inline-flex;align-items:center;gap:5px;margin:2px 14px 2px 0;font-size:12.5px;line-height:1.2;cursor:pointer}
.chk input{appearance:none;-webkit-appearance:none;width:12px;height:12px;border:1px solid #2b2b2b;margin:0;flex:0 0 12px;background:#fff;position:relative;cursor:pointer}
.chk input:checked::after{content:"✕";position:absolute;inset:-3px 0 0 0;text-align:center;font:700 12px Arimo,sans-serif;color:#111}
.chk input[type=text]{width:130px;flex:0 1 auto}
.chks{display:grid;gap:0 10px;padding:2px 2px}
.inline{display:flex;flex-wrap:wrap;align-items:center;padding-top:2px}
table.tb{width:calc(100% + .8px);border-collapse:collapse;margin:-.4px}
table.tb th{background:var(--band);font:700 8.6px Arimo,sans-serif;text-transform:uppercase;text-align:left;padding:3px 4px;border:.8px solid var(--grid)}
table.tb td{border:.8px solid var(--grid);padding:1.5px 2px;font-size:12px}
table.tb td input{font-size:12px!important}
.p{text-align:justify;line-height:1.38;margin:8px 0 6px}
.p.b{font-weight:700}.p.i{font-style:italic}.p.big{font-size:14.5px}
.note{font-style:italic;color:#555;font-size:11px;margin:4px 0 6px;line-height:1.35}
.init{display:flex;gap:12px;align-items:flex-start;margin:7px 0}
.init .box{flex:0 0 46px;text-align:center}
.init .box input{border:1px solid #2b2b2b!important;text-align:center;height:22px}
.init .box small{font:7px Arimo,sans-serif;color:#555}
.init div:last-child{padding-top:3px;line-height:1.35}
.cap{display:grid;grid-template-columns:56% 44%;margin:6px 0 10px}
.cap .lft{border-top:1px solid #222;border-bottom:1px solid #222;border-right:1px solid #222;padding:8px 8px 8px 4px}
.cap .lft b{font-size:13.5px}
.cap .lft i{font-size:11.5px;display:block}
.cap .lft .v{margin:9px 0 2px 22px;font-weight:700}
.cap .lft input{font:700 14px Tinos,serif!important;margin:4px 0 3px}
.cap .rgt{padding:0 0 0 10px}
.cap .rgt .ln{margin-bottom:6px}
.cap .rgt input{border-bottom:1px solid #444!important}
.atty{display:grid;grid-template-columns:56% 1fr;gap:20px;margin-bottom:6px;align-items:start}
.atty input{margin-bottom:1px}
.atty .it{font-style:italic;font-size:11.5px}
.stamp{border:1px dashed #777;min-height:68px;padding:3px}
.stamp .lbl{text-align:center;font-weight:700}
.stamp textarea{min-height:48px}
.sigs{display:grid;margin:8px 0 6px}
.sig{border:.8px solid var(--grid);margin:-.4px;position:relative}
.sig .hd{background:var(--band);border-bottom:.8px solid var(--grid);font:700 8.8px Arimo,sans-serif;text-transform:uppercase;padding:3px 5px}
.sig .bd{padding:4px 6px 6px;display:flex;gap:8px}
.sig .fs{flex:1;min-width:0}
.sig .ln{display:grid;grid-template-columns:62px 1fr;align-items:center;margin:2px 0}
.sig .ln .lbl{margin:0}
.sig .sg input{font:22px 'Homemade Apple',cursive!important;color:#0d2a6b!important;height:38px;border-bottom:1px solid #333!important;background:var(--fill)}
.seal-slot{flex:0 0 66px;height:66px;align-self:center;border:1.2px dashed #888;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font:7.5px Arimo,sans-serif;color:#777}
.foot{display:flex;justify-content:space-between;border-top:.8px solid #333;margin-top:16px;padding-top:4px;font:8.5px Arimo,sans-serif;color:#555}
.foot .c{text-align:center;flex:1}
/* static (export / print) */
.exp .v{display:block;min-height:17px;padding:1px 4px;font:13px Arimo,sans-serif;color:#0b1a33;white-space:pre-wrap;word-break:break-word}
.exp .sig .sg .v{font:22px 'Homemade Apple',cursive;color:#0d2a6b;min-height:38px;border-bottom:1px solid #333}
.exp .cap .rgt .v{border-bottom:1px solid #444}
.exp .cap .lft .v.big{font:700 14px Tinos,serif;margin:4px 0 3px}
.exp .init .box .v{border:1px solid #2b2b2b;text-align:center;min-height:22px}
.exp .xb{display:inline-block;width:12px;height:12px;border:1px solid #2b2b2b;text-align:center;font:700 11px/11px Arimo,sans-serif;flex:0 0 12px}
.exp .chk .v{display:inline-block;min-width:60px;border-bottom:1px solid #999;min-height:15px}
.exp table.tb .v{font-size:12px}
#printArea{display:none}
.bign input{font:700 26px Tinos,serif!important;text-transform:uppercase;letter-spacing:.5px;height:40px}
.exp .bign .v{font:700 26px Tinos,serif;text-transform:uppercase;letter-spacing:.5px;min-height:40px}
.pblock{display:grid;grid-template-columns:200px 1fr}
.pframe{border:.8px solid var(--grid);margin:-.4px;position:relative;min-height:240px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#f7f9fc;overflow:hidden}
.pframe .lbl{position:absolute;top:2px;left:4px}
.pframe img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.pframe .ph{font:12px Arimo,sans-serif;color:#667;text-align:center;padding:10px}
.pframe .rm{position:absolute;bottom:4px;right:4px;z-index:2}
.exp .pframe .ph,.exp .pframe .rm{display:none}
.exp .pframe{background:#fff}
@media print{
  @page{size:letter;margin:10mm}
  body{background:#fff;display:block}
  #side,#main{display:none!important}
  #printArea{display:block}
  #printArea .paper{box-shadow:none;width:auto;padding:0}
  .row,.sigs,.sig,table.tb tr,.init,.cap,.chks,.p,.cell{break-inside:avoid}
  .sec{break-after:avoid}
}
@media screen and (max-width:900px){
  body{flex-direction:column}
  #side{width:100%;flex:none;height:auto;position:static}
  .list{max-height:260px}
  #main{padding:0 8px 40px}
  .paper{padding:18px 14px}
  .row{flex-wrap:wrap}
  .row .cell{flex-basis:45%!important}
}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><span id="brandSeal"></span><div><b>Office of the Attorney General</b><small>State of San Andreas — Parquet</small></div></div>
  <div class="case">
    <h3>Dossier en cours</h3>
    <label>N° de dossier</label><input data-key="commun_dossier" placeholder="SA-2026-0001">
    <label>Prévenu(e)</label><input data-key="commun_prevenu" placeholder="Prénom NOM">
    <label>Comté</label><input data-key="commun_comte" placeholder="Los Santos">
    <label>Substitut en charge</label><input data-key="commun_procureur" placeholder="Nom du procureur">
    <div class="btns">
      <button class="btn small" onclick="newCase()">Nouveau dossier</button>
      <button class="btn small" onclick="exportCase()">Sauvegarder (.json)</button>
      <button class="btn small" onclick="document.getElementById('imp').click()">Ouvrir</button>
      <input type="file" id="imp" accept=".json" hidden onchange="importCase(this)">
    </div>
  </div>
  <nav class="list" id="list"><h3>Formulaires</h3></nav>
</aside>
<main id="main">
  <div class="toolbar">
    <div class="t" id="curTitle">—<small>Formulaire</small></div>
    <button class="btn" onclick="clearForm()">Vider</button>
    <button class="btn" onclick="exportPNG()">Image (Discord)</button>
    <button class="btn gold" onclick="doPrint()">Imprimer / PDF</button>
  </div>
  <div class="hint">Remplis directement sur le document. Tout est enregistré automatiquement dans ce navigateur. Pour un PDF : « Imprimer / PDF » puis destination « Enregistrer au format PDF ».</div>
  <div id="paperHost"></div>
</main>
<div id="printArea"></div>
<div id="toast"></div>

4 (1978)", "kind": "court", "banner": null, "ops": [{"t": "row", "cells": [["N° de dossier", 1, "commun_dossier"], ["Comté", 1, "commun_comte"], ["Date de la demande", 0.8, "date"]], "tall": false}, {"t": "section", "text": "1. Affiant (officier déclarant sous serment)"}, {"t": "row", "cells": [["Nom de l'affiant", 1.6, "affiant"], ["Grade", 0.8, "grade"], ["Matricule", 0.7, "matricule"], ["Unité", 1, "unite"]], "tall": false}, {"t": "checks", "label": "Agence", "opts": ["LSPD", "BCSO", "SASP", "FIB", ["Autre", 80]], "slug": "agence", "cols": 5}, {"t": "section", "text": "2. Déclaration"}, {"t": "para", "text": "Je soussigné(e), l'affiant désigné ci-dessus, déclare sous serment qu'il existe une probable cause de croire que les biens et éléments décrits ci-après se trouvent actuellement dans les lieux, véhicules ou sur les personnes désignés, et qu'ils relèvent d'un ou plusieurs des motifs prévus au § 1524 du Code pénal de San Andreas :", "bold": false, "italic": false, "big": false}, {"t": "checks", "label": null, "opts": ["(1) Biens volés ou détournés", "(2) Biens ou objets ayant servi à commettre un crime (felony)", "(3) Biens détenus en vue de commettre une infraction ou de la dissimuler", "(4) Éléments tendant à prouver qu'un crime a été commis ou qu'une personne l'a commis", ["Autre motif", 330]], "slug": "motif1524", "cols": 1}, {"t": "section", "text": "3. Lieux, véhicules et personnes à perquisitionner"}, {"t": "row", "cells": [["Adresse complète", 2, "adresse"], ["Occupant / propriétaire", 1.3, "occupant"]], "tall": false}, {"t": "area", "label": "Description précise des lieux (type de bâtiment, étages, annexes, accès)", "slug": "desc_lieux", "lines": 3, "hint": null}, {"t": "row", "cells": [["Véhicule(s) — modèle / couleur", 1.6, "veh"], ["Plaque", 0.8, "plaque"], ["Personne(s) à fouiller", 1.6, "personnes"]], "tall": false}, {"t": "section", "text": "4. Biens et éléments recherchés"}, {"t": "row", "cells": [["Élément n° 1", 1, "bien1"]], "tall": false}, {"t": "row", "cells": [["Élément n° 2", 1, "bien2"]], "tall": false}, {"t": "row", "cells": [["Élément n° 3", 1, "bien3"]], "tall": false}, {"t": "row", "cells": [["Élément n° 4", 1, "bien4"]], "tall": false}, {"t": "row", "cells": [["Élément n° 5", 1, "bien5"]], "tall": false}, {"t": "section", "text": "5. Exposé de la probable cause"}, {"t": "area", "label": "Faits précis, datés et sourcés", "slug": "pc", "lines": 12, "hint": "Indiquer l'origine de chaque information, sa date et sa fiabilité (informateur : fiabilité et base de connaissance — Gates)."}, {"t": "area", "label": "Lien entre l'infraction, les biens recherchés et les lieux (nexus)", "slug": "nexus", "lines": 4, "hint": null}, {"t": "section", "text": "6. Autorisations spéciales demandées"}, {"t": "checks", "label": null, "opts": [["Exécution de nuit, 22h–7h (§ 1533) — motif :", 250], ["Dispense d'annonce / no-knock (Richards v. Wisconsin) — motif :", 220], ["Mise sous scellés de l'affidavit — motif :", 280]], "slug": "speciales", "cols": 1}, {"t": "para", "text": "Je déclare sous peine de parjure, conformément aux lois de l'État de San Andreas, que ce qui précède est exact et sincère. Toute déclaration sciemment fausse ou faite au mépris de la vérité entraîne la nullité du mandat (Franks v. Delaware).", "bold": false, "italic": true, "big": false}, {"t": "sigs", "blocks": [{"title": "Affiant", "role": null, "seal": false, "slug": "affiant_sig", "nom_slug": null, "extra": "Date / heure"}, {"title": "Visa du Procureur", "role": "Deputy Attorney General — approuvé quant à la forme", "seal": false, "slug": "proc", "nom_slug": "commun_procureur", "extra": "Date"}]}, {"t": "row", "cells": [["Serment reçu devant moi le (Sworn and subscribed before me)", 2, "serment_date"], ["Juge", 1.5, "serment_juge"]], "tall": false}]}, {"code": "DA-004", "title": "Mandat de perquisition", "en": "Search Warrant", "ref": "Réf. : 4e Amendement ; S.A.P.C. §§ 1523, 1529, 1533, 1534, 1535, 1537", "kind": "court", "banner": null, "ops": [{"t": "row", "cells": [["N° du mandat", 1, "num_mandat"], ["N° de dossier", 1, "commun_dossier"], ["Comté", 1, "commun_comte"]], "tall": false}, {"t": "row", "cells": [["Réf. affidavit (DA-003)", 1, "ref_affidavit"], ["Affiant", 2, "affiant"]], "tall": false}, {"t": "para", "text": "AU NOM DU PEUPLE DE L'ÉTAT DE SAN ANDREAS, à tout officier de paix (peace officer) de l'État de San Andreas :", "bold": true, "italic": false, "big": true}, {"t": "para", "text": "Un affidavit ayant été souscrit sous serment devant moi par l'affiant désigné ci-dessus, et le tribunal ayant constaté qu'il existe une probable cause de croire que les biens décrits ci-dessous se trouvent dans les lieux désignés, conformément au Quatrième Amendement de la Constitution des États-Unis et aux §§ 1523 et suivants du Code pénal de San Andreas,", "bold": false, "italic": false, "big": false}, {"t": "para", "text": "VOUS ÊTES REQUIS DE PERQUISITIONNER :", "bold": true, "italic": false, "big": true}, {"t": "area", "label": "Lieux (adresse et description)", "slug": "lieux", "lines": 3, "hint": null}, {"t": "row", "cells": [["Véhicule(s) — modèle / plaque", 1.5, "veh"], ["Personne(s)", 1.5, "personnes"]], "tall": false}, {"t": "para", "text": "ET D'Y SAISIR LES BIENS ET ÉLÉMENTS SUIVANTS :", "bold": true, "italic": false, "big": true}, {"t": "area", "label": "Biens et éléments à saisir", "slug": "biens", "lines": 6, "hint": null}, {"t": "para", "text": "et de les conserver sous votre garde, ou de les remettre à ce tribunal, conformément à la loi. Une copie du présent mandat et un reçu détaillé des biens saisis seront remis à l'occupant ou laissés sur les lieux (§ 1535).", "bold": false, "italic": false, "big": false}, {"t": "section", "text": "Conditions d'exécution"}, {"t": "checks", "label": null, "opts": ["Exécution de jour uniquement (7h – 22h)", "Exécution de nuit autorisée (§ 1533)", "Dispense d'annonce (no-knock) autorisée", "Affidavit placé sous scellés"], "slug": "conditions", "cols": 2}, {"t": "para", "text": "Le présent mandat doit être exécuté et retourné au tribunal dans un délai de dix (10) jours à compter de sa délivrance (§ 1534). Passé ce délai, il est nul et de nul effet.", "bold": false, "italic": true, "big": false}, {"t": "row", "cells": [["Délivré le", 1, "delivre_le"], ["À (heure)", 0.7, "heure"], ["Expire le", 1, "expire_le"]], "tall": false}, {"t": "checks", "label": null, "opts": ["Signé par délégation, en l'absence d'un juge disponible (autorisation administrative)"], "slug": "delegation", "cols": 1}, {"t": "sigs", "blocks": [{"title": "Autorité signataire", "role": "Judge of the Superior Court of San Andreas", "seal": true, "slug": "juge", "nom_slug": null, "extra": "Date"}]}, {"t": "section", "text": "Procès-verbal de retour — Return to Search Warrant (§ 1537)"}, {"t": "row", "cells": [["Exécuté le", 1, "exec_le"], ["Heure", 0.6, "exec_heure"], ["Par (officier)", 1.6, "exec_par"], ["Matricule", 0.7, "exec_mat"]], "tall": false}, {"t": "checks", "label": "Copie du mandat et reçu", "opts": ["Remis à l'occupant", "Laissés sur les lieux", "Inventaire joint (DA-005)"], "slug": "retour", "cols": 3}, {"t": "sigs", "blocks": [{"title": "Officier ayant exécuté", "role": null, "seal": false, "slug": "officier", "nom_slug": null, "extra": "Date"}, {"title": "Greffe — reçu le", "role": "Clerk of the Superior Court", "seal": false, "slug": "greffe", "nom_slug": null, "extra": "Date"}]}]}, {"code": "DA-005", "title": "Procès-verbal de perquisition et de saisie", "en": "Search and Seizure Report — Property Inventory", "ref": "Réf. : S.A.P.C. §§ 1535, 1536, 1537 ; Wilson v. Arkansas, 514 U.S. 927 (1995) (règle d'annonce)", "kind": "agency", "banner": null, "ops": [{"t": "row", "cells": [["N° de dossier", 1, "commun_dossier"], ["N° du mandat (DA-004)", 1, "num_mandat"], ["Date", 0.8, "date"]], "tall": false}, {"t": "row", "cells": [["Adresse", 2.2, "adresse"], ["Heure début", 0.7, "h_debut"], ["Heure fin", 0.7, "h_fin"]], "tall": false}, {"t": " élivrance d'un mandat d'arrêt", "en": "Application and Declaration in Support of Arrest Warrant", "ref": "Réf. : 4e Amendement ; S.A.P.C. §§ 813, 817, 840 ; Payton v. New York, 445 U.S. 573 (1980)", "kind": "court", "banner": null, "ops": [{"t": "attorney"}, {"t": "caption", "extra": null}, {"t": "section", "text": "1. Identification de la personne recherchée"}, {"t": "row", "cells": [["Nom complet", 2, "commun_prevenu"], ["Date de naissance", 1, "ddn"], ["Sexe", 0.5, "sexe"]], "tall": false}, {"t": "row", "cells": [["Taille", 0.7, "taille"], ["Poids", 0.7, "poids"], ["Cheveux", 0.8, "cheveux"], ["Yeux", 0.8, "yeux"], ["Signes distinctifs", 2, "signes"]], "tall": false}, {"t": "row", "cells": [["Dernière adresse connue", 2, "adresse"], ["Véhicule (modèle / plaque)", 1.3, "vehicule"]], "tall": false}, {"t": "section", "text": "2. Infractions reprochées"}, {"t": "table", "headers": ["Chef", "Infraction", "Article S.A.P.C.", "Classification"], "weights": [0.6, 4, 1.4, 1.3], "nrows": 4, "slug": "chefs", "first": null}, {"t": "section", "text": "3. Fondement de la demande"}, {"t": "checks", "label": null, "opts": ["Plainte déposée (DA-008) — § 813", "Déclaration de probable cause — § 817", "Acte d'accusation (DA-009)", "Non-comparution (bench warrant)"], "slug": "fondement", "cols": 2}, {"t": "checks", "label": "Pièces jointes", "opts": ["Plainte", "Affidavit", "Dépositions de témoins", "Rapports d'enquête", ["Autre", 80]], "slug": "pieces", "cols": 5}, {"t": "section", "text": "4. Déclaration de probable cause"}, {"t": "area", "label": "Faits établissant la probable cause", "slug": "pc", "lines": 11, "hint": "Faits précis et sourcés permettant au juge d'apprécier de façon indépendante la probable cause."}, {"t": "section", "text": "5. Caution et conditions demandées"}, {"t": "row", "cells": [["Caution demandée ($)", 1, "caution"], ["Sans caution (No Bail)", 0.9, ["Oui"]], ["Motif", 2, "motif_nobail"]], "tall": false}, {"t": "checks", "label": "Risques", "opts": ["Risque de fuite", "Danger pour le public", "Pression sur témoins / victimes", "Récidive"], "slug": "risques", "cols": 4}, {"t": "checks", "label": null, "opts": [["Service de nuit autorisé (§ 840 — misdemeanor) — motif :", 230]], "slug": "nuit", "cols": 1}, {"t": "para", "text": "Le Peuple de l'État de San Andreas, représenté par le Procureur général, sollicite respectueusement l'examen de la présente requête et, si les conditions légales sont réunies, la délivrance d'un mandat d'arrêt à l'encontre de la personne désignée.", "bold": false, "italic": false, "big": false}, {"t": "para", "text": "Je déclare sous peine de parjure, conformément aux lois de l'État de San Andreas, que ce qui précède est exact.", "bold": false, "italic": true, "big": false}, {"t": "sigs", "blocks": [{"title": "Déclarant (affiant)", "role": null, "seal": false, "slug": "affiant", "nom_slug": null, "extra": "Date"}, {"title": "Pour le Procureur général", "role": "Deputy Attorney General — State of San Andreas", "seal": false, "slug": "proc", "nom_slug": "commun_procureur", "extra": "Date"}]}, {"t": "section", "text": "Décision du juge"}, {"t": "checks", "label": null, "opts": ["Mandat délivré (voir DA-007)", "Refusé — probable cause insuffisante", "Complément d'information requis"], "slug": "decision", "cols": 3}, {"t": "sigs", "blocks": [{"title": "Juge de la Cour supérieure", "role": "Judge of the Superior Court of San Andreas", "seal": true, "slug": "juge", "nom_slug": null, "extra": "Date"}]}]}, {"code": "DA-007", "title": "Mandat d'arrêt", "en": "Arrest Warrant", "ref": "Réf. : 4e Amendement ; S.A.P.C. §§ 813 à 817, 821, 825, 840 ; County of Riverside v. McLaughlin, 500 U.S. 44 (1991)", "kind": "court", "banner": null, "ops": [{"t": "row", "cells": [["N° du mandat", 1, "num_mandat"], ["N° de dossier", 1, "commun_dossier"], ["Comté", 1, "commun_comte"]], "tall": false}, {"t": "para", "text": "AU NOM DU PEUPLE DE L'ÉTAT DE SAN ANDREAS, à tout officier de paix (peace officer) de l'État de San Andreas :", "bold": true, "italic": false, "big": true}, {"t": "para", "text": "Une plainte, un acte d'accusation ou une déclaration sous serment ayant été présenté(e) à ce tribunal, et le tribunal ayant constaté l'existence d'une probable cause de croire que la ou les infractions ci-dessous ont été commises par la personne désignée,", "bold": false, "italic": false, "big": false}, {"t": "para", "text": "VOUS ÊTES REQUIS D'ARRÊTER :", "bold": true, "italic": false, "big": true}, {"t": "row", "cells": [["Nom complet", 2, "commun_prevenu"], ["Date de naissance", 1, "ddn"], ["Sexe", 0.5, "sexe"]], "tall": true}, {"t": "row", "cells": [["Taille", 0.7, "taille"], ["Poids", 0.7, "poids"], ["Cheveux", 0.8, "cheveux"], ["Yeux", 0.8, "yeux"], ["Signes distinctifs", 2, "signes"]], "tall": false}, {"t": "row", "cells": [["Dernière adresse connue", 2, "adresse"], ["Véhicule (modèle / plaque)", 1.3, "vehicule"]], "tall": false}, {"t": "table", "headers": ["Chef", "Infraction", "Article S.A.P.C.", "Classification"], "weights": [0.6, 4, 1.4, 1.3], "nrows": 3, "slug": "chefs", "first": null}, {"t": "para", "text": "et de la conduire sans délai inutile devant un magistrat de ce tribunal (§§ 821, 825). La personne arrêtée doit être présentée à un juge dans les 48 heures suivant son arrestation.", "bold": false, "italic": false, "big": false}, {"t": "section", "text": "Caution et conditions"}, {"t": "row", "cells": [["Caution fixée ($)", 1, "caution"], ["Sans caution (No Bail)", 1, ["Oui"]], ["Service de nuit autorisé (§ 840)", 1.3, ["Oui", "Non"]]], "tall": false}, {"t": "row", "cells": [["Délivré le", 1, "delivre_le"], ["À (heure)", 0.6, "heure"], ["Valable jusqu'au (ou jusqu'à exécution)", 1.6, "validite"]], "tall": false}, {"t": "checks", "label": null, "opts": ["Signé par délégation, en l'absence d'un juge disponible (autorisation administrative)"], "slug": "delegation", "cols": 1}, {"t": "sigs", "blocks": [{"title": "Autorité signataire", "role": "Judge of the Superior Court of San function delPhoto(k) { delete data[k]; save(); openForm(cur.code); }
function clearForm() {
